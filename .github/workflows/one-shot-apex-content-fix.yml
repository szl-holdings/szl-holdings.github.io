name: One-shot apex content identity fix

on:
  push:
    branches: [fix/apex-truth-contract-20260902]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/apex-truth-contract-20260902
      - name: Rebase remaining public identity surfaces to apex
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old = 'holdings.a-11-oy.com'
          new = 'a-11-oy.com'
          paths = [Path('robots.txt'), Path('sitemap.xml'), Path('brain/index.html'), Path('khipu/index.html')]
          changed = 0
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  changed += 1
          if changed != len(paths):
              raise SystemExit(f'expected stale canonical in all {len(paths)} identity files; changed {changed}')
          PY
          git config user.name "szl-build-fix[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robots.txt sitemap.xml brain/index.html khipu/index.html
          git diff --cached --check
          git commit -m "fix(pages): rebase remaining identities to apex" -m "Signed-off-by: szl-build-fix[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push origin HEAD:fix/apex-truth-contract-20260902
