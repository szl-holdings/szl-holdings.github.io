name: Apply root-relative link resolver repair

on:
  push:
    branches:
      - feat/responsive-apex-v3
    paths:
      - .github/workflows/apply-root-relative-link-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-root-relative-link-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/responsive-apex-v3
          fetch-depth: 0

      - name: Resolve root-relative references against the repository root
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/link-check.yml')
          text = path.read_text(encoding='utf-8')
          old = (
              '                  local = p.path\n'
              '                  if local and not (htmlfile.parent / local).exists():\n'
              '                      errors.append(f"{htmlfile}: local file not found -> {ref}")\n'
          )
          new = (
              '                  local = p.path\n'
              '                  if local:\n'
              '                      target = (\n'
              '                          root / local.lstrip("/")\n'
              '                          if local.startswith("/")\n'
              '                          else htmlfile.parent / local\n'
              '                      )\n'
              '                      if not target.exists():\n'
              '                          errors.append(f"{htmlfile}: local file not found -> {ref}")\n'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one root-relative resolver seam, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Prove the exact failing paths now resolve
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import urllib.parse

          root = Path('.')
          for ref in (
              '/assets/szl-responsive-apex-v3.css',
              '/assets/szl-responsive-apex-v3.js',
              '/products/',
          ):
              local = urllib.parse.urlparse(ref).path
              target = root / local.lstrip('/') if local.startswith('/') else Path('index.html').parent / local
              if not target.exists():
                  raise SystemExit(f'root-relative reference still unresolved: {ref} -> {target}')
          print('root-relative references resolve from repository root')
          PY
          python3 tests/test_responsive_apex_v3.py

      - name: Commit bounded repair and remove one-shot controller
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-root-relative-link-fix.yml
          git config user.name 'Lutar, Stephen P.'
          git config user.email 'stephenlutar2@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ci): resolve root-relative site paths from repository root' -m 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          git push origin HEAD:feat/responsive-apex-v3
