name: Link & Asset Check

# Minimal, dependency-free guard for a static GitHub Pages site: verify the
# committed HTML parses and that every local link / asset (including the Open
# Graph image referenced in <meta>) resolves before it is published.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: Validate HTML + local links/assets
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test recursive route and fragment guard
        run: python3 -m unittest discover -s tests -p test_site_links.py -v

      - name: Test and verify exact browser policy
        run: |
          python3 -m unittest discover -s tests -p test_browser_policy.py -v
          python3 scripts/bind_browser_policy.py --check

      - name: Check every HTML page and its local links/assets
        run: |
          python3 scripts/verify_site_links.py

      - name: Exercise CSP compatibility and enforcement in Chrome
        run: python3 tests/browser_policy_smoke.py

      - name: Check frontier public source and privacy boundary
        run: python3 tests/test_frontier_public_assets.py

      - name: Set up Node for offline estate filter contract
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Check public estate snapshot and local search
        run: python3 -m unittest discover -s tests -p test_estate_public_snapshot.py -v

      - name: Test public estate generator privacy and revision gate
        run: python3 -m unittest discover -s tests -p test_build_estate_public_snapshot.py -v

      - name: Test first-class kernel namespace projection
        run: python3 -m unittest discover -s tests -p test_build_kernel_public_snapshot.py -v

      - name: Validate PyPI publication metadata and complete catalog joins
        run: |
          python3 -m unittest discover -s tests -p test_build_pypi_public_snapshot.py -v
          python3 -m unittest discover -s tests -p test_build_public_catalog.py -v
          python3 scripts/build_pypi_public_snapshot.py --check
          python3 scripts/build_public_catalog.py --check

      - name: Check public model and dataset contract reports
        run: python3 -m unittest discover -s tests -p test_hf_contract_reports.py -v

      - name: Verify the source-bound replay download
        run: |
          python3 -m unittest discover -s tests -p test_receipt_replay_download.py -v
          python3 scripts/build_receipt_replay_bundle.py --check

      - name: Check public truth and accessibility contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import html.parser
          import json
          import re
          import urllib.parse
          import xml.etree.ElementTree as ET

          html_text = Path("index.html").read_text(encoding="utf-8")
          script = Path("app.js").read_text(encoding="utf-8")
          robots_text = Path("robots.txt").read_text(encoding="utf-8")
          sitemap_text = Path("sitemap.xml").read_text(encoding="utf-8")

          class AssetBindings(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.styles = []
                  self.scripts = []
                  self.canonicals = []
                  self.metadata = {}
                  self.hrefs = []
                  self.json_ld = []
                  self.duplicate_identity_attributes = []
                  self._json_ld_parts = None

              def handle_starttag(self, tag, attrs):
                  attribute_names = [name.casefold() for name, _ in attrs]
                  duplicates = sorted({
                      name for name in attribute_names if attribute_names.count(name) > 1
                  })
                  if tag in {"link", "meta", "script"} and duplicates:
                      self.duplicate_identity_attributes.append(
                          f"{tag}: {', '.join(duplicates)}"
                      )
                  values = dict(attrs)
                  href = values.get("href", "")
                  if href:
                      self.hrefs.append(href)
                  if tag == "link":
                      rel = [token.casefold() for token in values.get("rel", "").split()]
                      if "stylesheet" in rel and urllib.parse.urlparse(href).path.endswith("styles.css"):
                          self.styles.append(href)
                      if "canonical" in rel:
                          self.canonicals.append(href)
                  if tag == "meta":
                      identity = values.get("property") or values.get("name")
                      if identity and values.get("content") is not None:
                          self.metadata.setdefault(identity, []).append(values["content"])
                  if tag == "script":
                      src = values.get("src", "")
                      if urllib.parse.urlparse(src).path.endswith("app.js"):
                          self.scripts.append(src)
                      media_type = values.get("type", "").split(";", 1)[0].strip().casefold()
                      if media_type == "application/ld+json":
                          self._json_ld_parts = []

              def handle_data(self, data):
                  if self._json_ld_parts is not None:
                      self._json_ld_parts.append(data)

              def handle_endtag(self, tag):
                  if tag == "script" and self._json_ld_parts is not None:
                      self.json_ld.append("".join(self._json_ld_parts))
                      self._json_ld_parts = None

          bindings = AssetBindings()
          bindings.feed(html_text)
          if bindings.duplicate_identity_attributes:
              raise SystemExit(
                  "Public truth contract FAILED: duplicate attributes on identity-bearing tags: "
                  + "; ".join(bindings.duplicate_identity_attributes)
              )
          for asset in ("styles.css", "app.js"):
              repository_bytes = Path(asset).read_bytes().replace(b"\r\n", b"\n")
              version = hashlib.sha256(repository_bytes).hexdigest()[:12]
              binding = f'{asset}?v={version}'
              active = bindings.styles if asset == "styles.css" else bindings.scripts
              if active != [binding]:
                  raise SystemExit(
                      f"Public truth contract FAILED: {asset} must have exactly one active binding "
                      f"{binding}; observed {active}"
                  )
          origin = "https://holdings.a-11-oy.com/"
          product_origin = "https://a-11-oy.com/"
          image_url = origin + "assets/hero.png"
          docs_url = origin + "docs-site/"
          fallback_host = "szl-holdings.github.io"
          failures = []

          if Path("CNAME").read_text(encoding="utf-8").strip() != "holdings.a-11-oy.com":
              failures.append("CNAME must bind the company site to holdings.a-11-oy.com")
          authority = json.loads(Path("origin-authority.json").read_text(encoding="utf-8"))
          if (
              authority.get("schema") != "szl.origin-authority/v1"
              or authority.get("evidence_class") != "SOURCE_DECLARED"
              or authority.get("source_contract", {}).get("cname") != "holdings.a-11-oy.com"
              or authority.get("company_front_door", {}).get("origin") != origin.rstrip("/")
              or authority.get("product_runtime", {}).get("origin") != product_origin.rstrip("/")
              or authority.get("company_front_door", {}).get("runtime_health_claimed") is not False
          ):
              failures.append("source authority must preserve the separate company and product origins")
          catalog = json.loads(Path("products/catalog.json").read_text(encoding="utf-8"))
          if catalog.get("canonical_front_door") != origin + "products/":
              failures.append("product catalog must bind to the company origin")
          if catalog.get("product_origin") != product_origin:
              failures.append("product catalog must retain the separate A11oy product origin")
          if any(row.get("status") != "listed" for row in catalog.get("vertical_flagships", [])):
              failures.append("static catalog status must describe listing, not runtime readiness")
          if bindings.canonicals != [origin]:
              failures.append(f"expected exactly one canonical {origin}; observed {bindings.canonicals}")
          for key, expected in {
              "og:url": origin,
              "og:image": image_url,
              "twitter:image": image_url,
          }.items():
              observed = bindings.metadata.get(key, [])
              if observed != [expected]:
                  failures.append(f"{key} must be exactly {expected}; observed {observed}")

          json_ld_document = {}
          graph = []
          if len(bindings.json_ld) != 1:
              failures.append(f"expected exactly one JSON-LD block; observed {len(bindings.json_ld)}")
          else:
              def reject_duplicate_json_keys(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError(f"duplicate JSON key: {key}")
                      result[key] = value
                  return result

              try:
                  json_ld_document = json.loads(
                      bindings.json_ld[0],
                      object_pairs_hook=reject_duplicate_json_keys,
                  )
                  if not isinstance(json_ld_document, dict):
                      raise ValueError("top-level JSON-LD value must be an object")
                  graph = json_ld_document.get("@graph", [])
              except (AttributeError, json.JSONDecodeError, ValueError) as exc:
                  failures.append(f"JSON-LD must parse as an object graph: {exc}")
                  json_ld_document = {}
                  graph = []
              typed = {}
              def collect_typed_identities(value):
                  if isinstance(value, list):
                      for item in value:
                          collect_typed_identities(item)
                      return
                  if not isinstance(value, dict):
                      return
                  node_types = value.get("@type", [])
                  if isinstance(node_types, str):
                      node_types = [node_types]
                  if (
                      isinstance(node_types, list)
                      and all(isinstance(node_type, str) for node_type in node_types)
                  ):
                      for node_type in node_types:
                          typed.setdefault(node_type, []).append(value)
                  for item in value.values():
                      collect_typed_identities(item)
              collect_typed_identities(json_ld_document)
              organization_nodes = typed.get("Organization", [])
              website_nodes = typed.get("WebSite", [])
              if len(organization_nodes) != 1:
                  failures.append(
                      "JSON-LD must contain exactly one Organization; "
                      f"observed {len(organization_nodes)}"
                  )
              if len(website_nodes) != 1:
                  failures.append(
                      "JSON-LD must contain exactly one WebSite; "
                      f"observed {len(website_nodes)}"
                  )
              organization = organization_nodes[0] if len(organization_nodes) == 1 else {}
              website = website_nodes[0] if len(website_nodes) == 1 else {}
              if organization.get("@id") != origin + "#org" or organization.get("url") != origin:
                  failures.append("JSON-LD Organization identity must bind to the canonical origin")
              organization_same_as = organization.get("sameAs", [])
              if (
                  not isinstance(organization_same_as, list)
                  or product_origin.rstrip("/") not in organization_same_as
              ):
                  failures.append(
                      "JSON-LD Organization sameAs must retain the separate A11oy product origin"
                  )
              if website.get("@id") != origin + "#site" or website.get("url") != origin:
                  failures.append("JSON-LD WebSite identity must bind to the canonical origin")
              if website.get("publisher") != {"@id": origin + "#org"}:
                  failures.append("JSON-LD WebSite publisher must bind to the canonical Organization")

          def iter_json_string_values(value):
              if isinstance(value, str):
                  yield value
              elif isinstance(value, list):
                  for item in value:
                      yield from iter_json_string_values(item)
              elif isinstance(value, dict):
                  for item in value.values():
                      yield from iter_json_string_values(item)

          robot_sitemaps = [
              line.split(":", 1)[1].strip()
              for line in robots_text.splitlines()
              if line.lower().startswith("sitemap:")
          ]
          if robot_sitemaps != [origin + "sitemap.xml"]:
              failures.append(f"robots.txt sitemap must bind to the canonical origin; observed {robot_sitemaps}")
          try:
              sitemap_root = ET.fromstring(sitemap_text)
              sitemap_locations = [
                  node.text for node in sitemap_root.findall(
                      ".//{http://www.sitemaps.org/schemas/sitemap/0.9}loc"
                  )
              ]
          except ET.ParseError as exc:
              failures.append(f"sitemap.xml must parse: {exc}")
              sitemap_locations = []
          expected_sitemap_locations = [
              origin,
              origin + "brain/",
              origin + "khipu/",
              origin + "products/",
              origin + "frontier/",
              origin + "docs-site/",
          ]
          if sitemap_locations != expected_sitemap_locations:
              failures.append(
                  "sitemap.xml must publish the complete ordered canonical route set; "
                  f"expected {expected_sitemap_locations}; observed {sitemap_locations}"
              )

          for route in ("brain", "khipu", "products"):
              route_bindings = AssetBindings()
              route_bindings.feed(Path(route, "index.html").read_text(encoding="utf-8"))
              expected_route = origin + route + "/"
              if route_bindings.canonicals != [expected_route]:
                  failures.append(
                      f"{route}/index.html must bind exactly once to {expected_route}; "
                      f"observed {route_bindings.canonicals}"
                  )

          docs_targets = [href for href in bindings.hrefs if "docs-site" in href]
          if docs_targets != [docs_url] * 4:
              failures.append(
                  f"all four visible developer-docs CTAs must target {docs_url}; observed {docs_targets}"
              )
          if "https://github.com/szl-holdings" not in bindings.hrefs:
              failures.append("the explicit GitHub organization source link must remain present")
          if product_origin + "docs-site/" in bindings.hrefs:
              failures.append("developer docs must not use the A11oy product origin")

          identity_values = (
              bindings.canonicals
              + [value for values in bindings.metadata.values() for value in values]
              + list(iter_json_string_values(json_ld_document))
              + robot_sitemaps
              + [value for value in sitemap_locations if isinstance(value, str)]
          )
          identity_surface = "\n".join(
              identity_values + bindings.json_ld + [robots_text, sitemap_text]
          )
          def normalize_identity_hostname(url):
              if any(character.isspace() or ord(character) < 0x20 for character in url):
                  raise ValueError("URL contains whitespace or control characters")
              try:
                  parsed = urllib.parse.urlsplit(url)
              except ValueError as exc:
                  raise ValueError("URL authority is malformed") from exc
              scheme = parsed.scheme.casefold()
              if scheme not in {"http", "https", ""}:
                  raise ValueError("identity URL must use HTTP, HTTPS, or a network-path reference")
              if scheme == "" and not url.startswith("//"):
                  raise ValueError("identity URL must use HTTP or HTTPS")
              authority = parsed.netloc
              if not authority:
                  raise ValueError("URL does not contain an authority")
              if re.search(r"%(?![0-9A-Fa-f]{2})", authority):
                  raise ValueError("authority contains a malformed percent escape")
              try:
                  decoded_authority = urllib.parse.unquote_to_bytes(authority).decode("utf-8")
              except UnicodeDecodeError as exc:
                  raise ValueError("authority percent escapes are not valid UTF-8") from exc
              if any(character in "\\/?#@" for character in decoded_authority):
                  raise ValueError("decoded authority contains a prohibited delimiter")
              try:
                  hostname = parsed.hostname
                  parsed.port
              except ValueError as exc:
                  raise ValueError("URL hostname or port is malformed") from exc
              if not hostname:
                  raise ValueError("URL does not contain a hostname")
              if hostname.startswith("[") and hostname.endswith("]"):
                  hostname = hostname[1:-1]
              if ":" in hostname:
                  return hostname.casefold()
              if re.search(r"%(?![0-9A-Fa-f]{2})", hostname):
                  raise ValueError("hostname contains a malformed percent escape")
              try:
                  hostname = urllib.parse.unquote_to_bytes(hostname).decode("utf-8")
              except UnicodeDecodeError as exc:
                  raise ValueError("hostname percent escapes are not valid UTF-8") from exc
              if any(
                  character.isspace()
                  or ord(character) < 0x20
                  or character in "%/\\?#@:[]"
                  for character in hostname
              ):
                  raise ValueError("decoded hostname contains a prohibited delimiter")
              try:
                  normalized = hostname.encode("idna").decode("ascii").rstrip(".").casefold()
              except UnicodeError as exc:
                  raise ValueError("hostname is not valid IDNA") from exc
              if not normalized or normalized.startswith(".") or ".." in normalized:
                  raise ValueError("hostname contains an empty DNS label")
              return normalized

          normalized_fallback_host = normalize_identity_hostname(
              "https://" + fallback_host + "/"
          )
          equivalent_fallback_urls = (
              "https://SZL-HOLDINGS.GITHUB.IO./",
              "https://szl-holdings\u3002github\u3002io/",
              "https://szl-holdings.github.io\u3002/",
              "https://szl-holdings%2egithub%2eio/",
              "//szl-holdings.github.io/",
          )
          if normalized_fallback_host != fallback_host.casefold() or any(
              normalize_identity_hostname(url) != normalized_fallback_host
              for url in equivalent_fallback_urls
          ):
              failures.append("identity hostname normalizer must reject equivalent fallback DNS names")
          if normalize_identity_hostname(
              "https://szl-holdings.github.io.evil.example/"
          ) == normalized_fallback_host:
              failures.append("identity hostname normalizer must preserve DNS label boundaries")
          try:
              ipv6_host = normalize_identity_hostname("https://[2001:db8::1]/")
          except ValueError:
              failures.append("identity hostname normalizer must allow IPv6 literals")
          else:
              if ipv6_host != "2001:db8::1":
                  failures.append("identity hostname normalizer must preserve IPv6 literals")

          identity_urls = set(
              re.findall(r'(?:https?:)?//[^\s"\'<>]+', identity_surface, flags=re.IGNORECASE)
          )
          identity_urls.update(
              value.strip()
              for value in identity_values
              if re.match(r"(?i)^(?:https?:)?//", value.strip())
          )
          identity_hosts = set()
          for url in identity_urls:
              try:
                  normalized_host = normalize_identity_hostname(url)
              except ValueError as exc:
                  failures.append(f"identity URL hostname must be valid ({url!r}): {exc}")
                  continue
              if normalized_host:
                  identity_hosts.add(normalized_host)
          if normalized_fallback_host in identity_hosts:
              failures.append("stale fallback-host identity is prohibited in canonical metadata")

          required = {
              'href="#main-content"': "skip link",
              'aria-controls="primaryNavigation"': "menu ownership",
              'id="verifyBadge">CHECKING</span>': "fail-closed initial receipt state",
              "offline sample": "offline truth label",
              "A public URL proves where a surface is published": "surface truth boundary",
              'var PINNED_RECEIPT_KEY_ID = ""': "fail-closed trust-root pin",
              'var PINNED_RECEIPT_SPKI_SHA256 = ""': "fail-closed SPKI pin",
              'var ROUTER_ENDPOINT = ""': "disabled unavailable live route",
              'var PUBKEY_ENDPOINT = ""': "disabled unavailable key route",
              'setMenu(false, true)': "focus leaves hidden mobile menu",
              'showReceiptState("CHECKING", "muted")': "visible bounded checking state",
              'fetchBounded(ROUTER_ENDPOINT': "bounded concierge transport",
              'payload.message_sha256 !== requestHash': "request hash binding",
              'payload.reply_sha256 !== replyHash': "reply hash binding",
          }
          prohibited = {
              "Every answer ships a receipt.": "universal receipt claim",
              "Every action emits a DSSE": "universal signing claim",
              "nothing moves without leaving a signed trace": "universal runtime claim",
              "against szl-router's pinned public key": "unproven key pin claim",
              "https://alloyszlholdings.com/szl-concierge/chat": "unbound live concierge route",
              "https://alloyszlholdings.com/szl-concierge/pubkey": "unbound public-key route",
              "live projection · one receipt routing": "modeled diagram labeled live",
          }
          joined = html_text + "\n" + script
          for needle, label in required.items():
              if needle not in joined:
                  failures.append(f"missing {label}: {needle}")
          for needle, label in prohibited.items():
              if needle in joined:
                  failures.append(f"prohibited {label}: {needle}")
          if failures:
              raise SystemExit("Public truth contract FAILED:\n - " + "\n - ".join(failures))
          print(f"OK: {len(required)} required and {len(prohibited)} prohibited truth checks passed.")
          PY

  receipt-replay:
    name: Replay source-bound SAMPLE receipt cases
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SZL_REPLAY_SOURCE_DIR: ${{ github.workspace }}/receipt-source
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
      - name: Checkout tutorial source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout immutable canonical verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/szl-receipt
          ref: 1467fcbd1ff57b955d588c73e64a541ebc16770f
          path: receipt-source
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install reviewed dependency bytes
        run: |
          python -I -m venv "$RUNNER_TEMP/receipt-replay-venv"
          "$RUNNER_TEMP/receipt-replay-venv/bin/python" -I -m pip --isolated install --require-hashes --only-binary=:all: -r estate/receipt-replay/requirements.lock
      - name: Exercise source and import rejection controls
        run: '"$RUNNER_TEMP/receipt-replay-venv/bin/python" -I tests/test_receipt_replay_contract.py --source-dir "$SZL_REPLAY_SOURCE_DIR"'
      - name: Run all four SAMPLE cases
        run: '"$RUNNER_TEMP/receipt-replay-venv/bin/python" -I estate/receipt-replay/replay.py --source-dir "$SZL_REPLAY_SOURCE_DIR" --output "$RUNNER_TEMP/receipt-replay-ci.json"'
      - name: Retain bounded CI replay evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: receipt-replay-sample-evidence
          path: ${{ runner.temp }}/receipt-replay-ci.json
          if-no-files-found: error
          retention-days: 30
