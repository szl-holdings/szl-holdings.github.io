name: Link & Asset Check

# Minimal, dependency-free guard for a static GitHub Pages site: verify the
# committed HTML parses and that every local link / asset (including the Open
# Graph image referenced in <meta>) resolves before it is published.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: Validate HTML + local links/assets
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # offline byte readbacks bind to immutable dated source commits

      - name: Test recursive route and fragment guard
        run: |
          python3 -m unittest discover -s tests -p test_site_links.py -v
          python3 -m unittest discover -s tests -p test_kanchay_projection.py -v

      - name: Test and verify exact browser policy
        run: |
          python3 -m unittest discover -s tests -p test_browser_policy.py -v
          python3 scripts/bind_browser_policy.py --check

      - name: Check every HTML page and its local links/assets
        run: |
          python3 scripts/verify_site_links.py

      - name: Exercise CSP compatibility and enforcement in Chrome
        run: python3 tests/browser_policy_smoke.py

      - name: Check frontier public source and privacy boundary
        run: python3 tests/test_frontier_public_assets.py

      - name: Set up Node for offline estate filter contract
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Check public estate snapshot and local search
        run: python3 -m unittest discover -s tests -p test_estate_public_snapshot.py -v

      - name: Test public estate generator privacy and revision gate
        run: python3 -m unittest discover -s tests -p test_build_estate_public_snapshot.py -v

      - name: Test first-class kernel namespace projection
        run: python3 -m unittest discover -s tests -p test_build_kernel_public_snapshot.py -v

      - name: Validate PyPI publication metadata and complete catalog joins
        run: |
          python3 -m unittest discover -s tests -p test_build_pypi_public_snapshot.py -v
          python3 -m unittest discover -s tests -p test_build_public_catalog.py -v
          python3 scripts/build_pypi_public_snapshot.py --check
          python3 scripts/build_public_catalog.py --check

      - name: Check pinned PyPI archive byte readback offline
        run: |
          python3 -m unittest discover -s tests -p test_verify_pypi_artifact_bytes.py -v
          python3 scripts/verify_pypi_artifact_bytes.py --check

      - name: Check pinned Kernel Hub shared-path byte readback offline
        run: |
          python3 -m unittest discover -s tests -p test_verify_kernel_shared_bytes.py -v
          python3 scripts/verify_kernel_shared_bytes.py --check

      - name: Check public model and dataset contract reports
        run: python3 -m unittest discover -s tests -p test_hf_contract_reports.py -v

      - name: Check public measured upgrade evidence and exact static rendering
        run: |
          python3 -m unittest discover -s tests -p test_verified_upgrades.py -v
          python3 scripts/build_verified_upgrades.py --check

      - name: Verify the source-bound replay download
        run: |
          python3 -m unittest discover -s tests -p test_receipt_replay_download.py -v
          python3 scripts/build_receipt_replay_bundle.py --check

      - name: Check public truth and accessibility contract
        run: |
          python3 -m unittest discover -s tests -p test_check_public_truth_accessibility.py -v
          python3 scripts/check_public_truth_accessibility.py

  receipt-replay:
    name: Replay source-bound SAMPLE receipt cases
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SZL_REPLAY_SOURCE_DIR: ${{ github.workspace }}/receipt-source
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit
      - name: Checkout tutorial source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout immutable canonical verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/szl-receipt
          ref: 1467fcbd1ff57b955d588c73e64a541ebc16770f
          path: receipt-source
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install reviewed dependency bytes
        run: |
          python -I -m venv "$RUNNER_TEMP/receipt-replay-venv"
          "$RUNNER_TEMP/receipt-replay-venv/bin/python" -I -m pip --isolated install --require-hashes --only-binary=:all: -r estate/receipt-replay/requirements.lock
      - name: Exercise source and import rejection controls
        run: '"$RUNNER_TEMP/receipt-replay-venv/bin/python" -I tests/test_receipt_replay_contract.py --source-dir "$SZL_REPLAY_SOURCE_DIR"'
      - name: Run all four SAMPLE cases
        run: '"$RUNNER_TEMP/receipt-replay-venv/bin/python" -I estate/receipt-replay/replay.py --source-dir "$SZL_REPLAY_SOURCE_DIR" --output "$RUNNER_TEMP/receipt-replay-ci.json"'
      - name: Retain bounded CI replay evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: receipt-replay-sample-evidence
          path: ${{ runner.temp }}/receipt-replay-ci.json
          if-no-files-found: error
          retention-days: 30
