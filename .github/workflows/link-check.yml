name: Link & Asset Check

# Minimal, dependency-free guard for a static GitHub Pages site: verify the
# committed HTML parses and that every local link / asset (including the Open
# Graph image referenced in <meta>) resolves before it is published.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: Validate HTML + local links/assets
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check HTML parses + local links/assets resolve
        run: |
          python3 - <<'PY'
          import html.parser, pathlib, sys, urllib.parse
          import xml.etree.ElementTree as ET

          root = pathlib.Path(".")
          same_origin = {"szl-holdings.github.io", "holdings.a-11-oy.com"}
          separately_published_paths = {"/docs-site/"}
          errors = []

          class Extractor(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
                  self.anchors = set()

              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if d.get("id"):
                      self.anchors.add("#" + d["id"])
                  for key in ("href", "src"):
                      if d.get(key):
                          self.refs.append(d[key])
                  # og:image / twitter:image live in <meta content=...>
                  ident = (d.get("property", "") + d.get("name", ""))
                  if d.get("content") and ident.endswith("image"):
                      self.refs.append(d["content"])

          def is_external(u):
              p = urllib.parse.urlparse(u)
              return p.scheme in ("http", "https") and p.netloc not in same_origin

          for htmlfile in sorted(root.glob("*.html")):
              ex = Extractor()
              ex.feed(htmlfile.read_text(encoding="utf-8"))
              for ref in ex.refs:
                  if not ref or ref.startswith(("data:", "mailto:", "tel:", "javascript:")):
                      continue
                  if is_external(ref):
                      continue
                  p = urllib.parse.urlparse(ref)
                  if p.scheme in ("http", "https"):
                      if p.path in separately_published_paths:
                          continue
                      path = p.path.lstrip("/")
                      if path and not (root / path).exists():
                          errors.append(f"{htmlfile}: same-origin ref not found -> {ref}")
                      continue
                  if ref.startswith("#"):
                      if ref != "#" and ref not in ex.anchors:
                          errors.append(f"{htmlfile}: in-page anchor has no target -> {ref}")
                      continue
                  local = p.path
                  if local and not (htmlfile.parent / local).exists():
                      errors.append(f"{htmlfile}: local file not found -> {ref}")

          if (root / "sitemap.xml").exists():
              try:
                  ET.parse(root / "sitemap.xml")
              except ET.ParseError as e:
                  errors.append(f"sitemap.xml is not valid XML: {e}")

          if errors:
              print("Link/asset check FAILED:")
              for e in errors:
                  print(" -", e)
              sys.exit(1)
          print("OK: HTML parses and all local links/assets resolve.")
          PY

      - name: Check public truth and accessibility contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import html.parser
          import json
          import re
          import urllib.parse
          import xml.etree.ElementTree as ET

          html_text = Path("index.html").read_text(encoding="utf-8")
          script = Path("app.js").read_text(encoding="utf-8")
          robots_text = Path("robots.txt").read_text(encoding="utf-8")
          sitemap_text = Path("sitemap.xml").read_text(encoding="utf-8")

          class AssetBindings(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.styles = []
                  self.scripts = []
                  self.canonicals = []
                  self.metadata = {}
                  self.hrefs = []
                  self.json_ld = []
                  self.duplicate_identity_attributes = []
                  self._json_ld_parts = None

              def handle_starttag(self, tag, attrs):
                  attribute_names = [name.casefold() for name, _ in attrs]
                  duplicates = sorted({
                      name for name in attribute_names if attribute_names.count(name) > 1
                  })
                  if tag in {"link", "meta", "script"} and duplicates:
                      self.duplicate_identity_attributes.append(
                          f"{tag}: {', '.join(duplicates)}"
                      )
                  values = dict(attrs)
                  href = values.get("href", "")
                  if href:
                      self.hrefs.append(href)
                  if tag == "link":
                      rel = [token.casefold() for token in values.get("rel", "").split()]
                      if "stylesheet" in rel and urllib.parse.urlparse(href).path.endswith("styles.css"):
                          self.styles.append(href)
                      if "canonical" in rel:
                          self.canonicals.append(href)
                  if tag == "meta":
                      identity = values.get("property") or values.get("name")
                      if identity and values.get("content") is not None:
                          self.metadata.setdefault(identity, []).append(values["content"])
                  if tag == "script":
                      src = values.get("src", "")
                      if urllib.parse.urlparse(src).path.endswith("app.js"):
                          self.scripts.append(src)
                      if values.get("type") == "application/ld+json":
                          self._json_ld_parts = []

              def handle_data(self, data):
                  if self._json_ld_parts is not None:
                      self._json_ld_parts.append(data)

              def handle_endtag(self, tag):
                  if tag == "script" and self._json_ld_parts is not None:
                      self.json_ld.append("".join(self._json_ld_parts))
                      self._json_ld_parts = None

          bindings = AssetBindings()
          bindings.feed(html_text)
          if bindings.duplicate_identity_attributes:
              raise SystemExit(
                  "Public truth contract FAILED: duplicate attributes on identity-bearing tags: "
                  + "; ".join(bindings.duplicate_identity_attributes)
              )
          for asset in ("styles.css", "app.js"):
              repository_bytes = Path(asset).read_bytes().replace(b"\r\n", b"\n")
              version = hashlib.sha256(repository_bytes).hexdigest()[:12]
              binding = f'{asset}?v={version}'
              active = bindings.styles if asset == "styles.css" else bindings.scripts
              if active != [binding]:
                  raise SystemExit(
                      f"Public truth contract FAILED: {asset} must have exactly one active binding "
                      f"{binding}; observed {active}"
                  )
          origin = "https://holdings.a-11-oy.com/"
          image_url = origin + "assets/hero.png"
          docs_url = origin + "docs-site/"
          fallback_host = "szl-holdings.github.io"
          failures = []

          if Path("CNAME").read_text(encoding="utf-8").strip() != "holdings.a-11-oy.com":
              failures.append("CNAME must remain holdings.a-11-oy.com")
          if bindings.canonicals != [origin]:
              failures.append(f"expected exactly one canonical {origin}; observed {bindings.canonicals}")
          for key, expected in {
              "og:url": origin,
              "og:image": image_url,
              "twitter:image": image_url,
          }.items():
              observed = bindings.metadata.get(key, [])
              if observed != [expected]:
                  failures.append(f"{key} must be exactly {expected}; observed {observed}")

          graph = []
          if len(bindings.json_ld) != 1:
              failures.append(f"expected exactly one JSON-LD block; observed {len(bindings.json_ld)}")
          else:
              def reject_duplicate_json_keys(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError(f"duplicate JSON key: {key}")
                      result[key] = value
                  return result

              try:
                  graph = json.loads(
                      bindings.json_ld[0],
                      object_pairs_hook=reject_duplicate_json_keys,
                  ).get("@graph", [])
              except (AttributeError, json.JSONDecodeError, ValueError) as exc:
                  failures.append(f"JSON-LD must parse as an object graph: {exc}")
                  graph = []
              typed = {}
              for node in graph:
                  if not isinstance(node, dict):
                      continue
                  node_types = node.get("@type", [])
                  if isinstance(node_types, str):
                      node_types = [node_types]
                  if not (
                      isinstance(node_types, list)
                      and all(isinstance(node_type, str) for node_type in node_types)
                  ):
                      continue
                  for node_type in node_types:
                      typed.setdefault(node_type, []).append(node)
              organization_nodes = typed.get("Organization", [])
              website_nodes = typed.get("WebSite", [])
              if len(organization_nodes) != 1:
                  failures.append(
                      "JSON-LD must contain exactly one Organization; "
                      f"observed {len(organization_nodes)}"
                  )
              if len(website_nodes) != 1:
                  failures.append(
                      "JSON-LD must contain exactly one WebSite; "
                      f"observed {len(website_nodes)}"
                  )
              organization = organization_nodes[0] if len(organization_nodes) == 1 else {}
              website = website_nodes[0] if len(website_nodes) == 1 else {}
              if organization.get("@id") != origin + "#org" or organization.get("url") != origin:
                  failures.append("JSON-LD Organization identity must bind to the canonical origin")
              if website.get("@id") != origin + "#site" or website.get("url") != origin:
                  failures.append("JSON-LD WebSite identity must bind to the canonical origin")
              if website.get("publisher") != {"@id": origin + "#org"}:
                  failures.append("JSON-LD WebSite publisher must bind to the canonical Organization")

          def iter_json_string_values(value):
              if isinstance(value, str):
                  yield value
              elif isinstance(value, list):
                  for item in value:
                      yield from iter_json_string_values(item)
              elif isinstance(value, dict):
                  for item in value.values():
                      yield from iter_json_string_values(item)

          robot_sitemaps = [
              line.split(":", 1)[1].strip()
              for line in robots_text.splitlines()
              if line.lower().startswith("sitemap:")
          ]
          if robot_sitemaps != [origin + "sitemap.xml"]:
              failures.append(f"robots.txt sitemap must bind to the canonical origin; observed {robot_sitemaps}")
          try:
              sitemap_root = ET.fromstring(sitemap_text)
              sitemap_locations = [
                  node.text for node in sitemap_root.findall(
                      ".//{http://www.sitemaps.org/schemas/sitemap/0.9}loc"
                  )
              ]
          except ET.ParseError as exc:
              failures.append(f"sitemap.xml must parse: {exc}")
              sitemap_locations = []
          if sitemap_locations != [origin]:
              failures.append(f"sitemap.xml must publish exactly the canonical origin; observed {sitemap_locations}")

          docs_targets = [href for href in bindings.hrefs if "docs-site" in href]
          if docs_targets != [docs_url] * 4:
              failures.append(
                  f"all four visible developer-docs CTAs must target {docs_url}; observed {docs_targets}"
              )
          if "https://github.com/szl-holdings" not in bindings.hrefs:
              failures.append("the explicit GitHub organization source link must remain present")

          identity_surface = "\n".join(
              bindings.canonicals
              + [value for values in bindings.metadata.values() for value in values]
              + bindings.json_ld
              + list(iter_json_string_values(graph))
              + [robots_text, sitemap_text]
          )
          def normalize_identity_hostname(url):
              try:
                  hostname = urllib.parse.urlparse(url).hostname
              except ValueError:
                  return None
              if not hostname:
                  return None
              try:
                  return hostname.encode("idna").decode("ascii").rstrip(".").casefold()
              except UnicodeError:
                  return None

          normalized_fallback_host = normalize_identity_hostname(
              "https://" + fallback_host + "/"
          )
          equivalent_fallback_urls = (
              "https://SZL-HOLDINGS.GITHUB.IO./",
              "https://szl-holdings\u3002github\u3002io/",
              "https://szl-holdings.github.io\u3002/",
          )
          if normalized_fallback_host != fallback_host.casefold() or any(
              normalize_identity_hostname(url) != normalized_fallback_host
              for url in equivalent_fallback_urls
          ):
              failures.append("identity hostname normalizer must reject equivalent fallback DNS names")
          if normalize_identity_hostname(
              "https://szl-holdings.github.io.evil.example/"
          ) == normalized_fallback_host:
              failures.append("identity hostname normalizer must preserve DNS label boundaries")

          identity_hosts = {
              normalize_identity_hostname(url)
              for url in re.findall(r'https?://[^\s"\'<>]+', identity_surface, flags=re.IGNORECASE)
          }
          if normalized_fallback_host in identity_hosts:
              failures.append("stale fallback-host identity is prohibited in canonical metadata")

          required = {
              'href="#main-content"': "skip link",
              'aria-controls="primaryNavigation"': "menu ownership",
              'id="verifyBadge">CHECKING</span>': "fail-closed initial receipt state",
              "offline sample": "offline truth label",
              "A public URL proves where a surface is published": "surface truth boundary",
              'var PINNED_RECEIPT_KEY_ID = ""': "fail-closed trust-root pin",
              'var PINNED_RECEIPT_SPKI_SHA256 = ""': "fail-closed SPKI pin",
              'var ROUTER_ENDPOINT = ""': "disabled unavailable live route",
              'var PUBKEY_ENDPOINT = ""': "disabled unavailable key route",
              'setMenu(false, true)': "focus leaves hidden mobile menu",
              'showReceiptState("CHECKING", "muted")': "visible bounded checking state",
              'fetchBounded(ROUTER_ENDPOINT': "bounded concierge transport",
              'payload.message_sha256 !== requestHash': "request hash binding",
              'payload.reply_sha256 !== replyHash': "reply hash binding",
          }
          prohibited = {
              "Every answer ships a receipt.": "universal receipt claim",
              "Every action emits a DSSE": "universal signing claim",
              "nothing moves without leaving a signed trace": "universal runtime claim",
              "against szl-router's pinned public key": "unproven key pin claim",
              "https://alloyszlholdings.com/szl-concierge/chat": "unbound live concierge route",
              "https://alloyszlholdings.com/szl-concierge/pubkey": "unbound public-key route",
              "live projection · one receipt routing": "modeled diagram labeled live",
          }
          joined = html_text + "\n" + script
          for needle, label in required.items():
              if needle not in joined:
                  failures.append(f"missing {label}: {needle}")
          for needle, label in prohibited.items():
              if needle in joined:
                  failures.append(f"prohibited {label}: {needle}")
          if failures:
              raise SystemExit("Public truth contract FAILED:\n - " + "\n - ".join(failures))
          print(f"OK: {len(required)} required and {len(prohibited)} prohibited truth checks passed.")
          PY
