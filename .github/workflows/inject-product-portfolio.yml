name: Inject product portfolio
on:
  push:
    branches: [feat/product-portfolio-front-door]
    paths:
      - scripts/inject_product_portfolio.py
      - products/**
      - .github/workflows/inject-product-portfolio.yml
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python scripts/inject_product_portfolio.py
      - name: Verify portfolio contract
        run: |
          grep -q 'href="/products/"' index.html
          grep -q 'id="products"' index.html
          python -m json.tool products/catalog.json >/dev/null
      - name: Commit generated front door
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat(site): expose full product portfolio on front door'
          git push origin HEAD:feat/product-portfolio-front-door
