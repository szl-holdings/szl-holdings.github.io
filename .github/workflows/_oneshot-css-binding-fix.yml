name: One-shot stylesheet binding fix

on:
  push:
    branches:
      - fix/live-canary-touch-overflow-20260902

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/live-canary-touch-overflow-20260902
          fetch-depth: 0
      - name: Bind stylesheet to exact content hash
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = 'styles.css?v=20260902a11y'
          new = 'styles.css?v=a991a82510ef'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one old binding, observed {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/_oneshot-css-binding-fix.yml
          git config user.name 'szl-build-fix[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/_oneshot-css-binding-fix.yml
          git diff --cached --check
          git commit -s -m 'fix(frontend): bind stylesheet to content hash'
          git push origin HEAD:fix/live-canary-touch-overflow-20260902
