name: Bind Responsive Apex v3 on Review Branch

on:
  push:
    branches:
      - feat/responsive-apex-v3
    paths:
      - ".github/workflows/bind-responsive-apex-v3-on-branch.yml"

permissions:
  contents: write

concurrency:
  group: bind-responsive-apex-v3
  cancel-in-progress: false

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/responsive-apex-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Bind responsive assets to published HTML
        run: python tools/bind_responsive_apex_v3.py

      - name: Verify binding and public contracts
        run: |
          python tools/bind_responsive_apex_v3.py --check
          python tests/test_responsive_apex_v3.py -v
          node --check assets/szl-responsive-apex-v3.js
          git diff --check

      - name: Commit generated bindings and retire controller
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bind-responsive-apex-v3-on-branch.yml
          git config user.name "SZL Apex Responsive Controller"
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git commit -s -m "feat(frontend): bind responsive v3 across apex surfaces"
          git push origin HEAD:feat/responsive-apex-v3
