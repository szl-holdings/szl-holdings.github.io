name: Materialize product front-door assets

on:
  push:
    branches:
      - fix/product-frontdoor-spectral-assets-v2
    paths:
      - ".github/workflows/materialize-product-frontdoor-assets.yml"

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: materialize-product-frontdoor-assets-v2
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact product-origin candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/product-frontdoor-spectral-assets-v2
          path: target
          fetch-depth: 0

      - name: Checkout current protected A11oy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/a11oy
          ref: main
          path: a11oy-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Bind exact source bytes into the static origin
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git -C a11oy-source rev-parse HEAD)"
          python target/scripts/materialize_product_frontdoor_assets.py \
            --target target \
            --source a11oy-source \
            --source-sha "$source_sha" \
            --report /tmp/product-frontdoor-assets-apply.json
          python target/scripts/materialize_product_frontdoor_assets.py \
            --target target \
            --check \
            --report /tmp/product-frontdoor-assets-check.json

      - name: Run exact materializer contracts
        working-directory: target
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_product_frontdoor_assets.py
          python -m py_compile scripts/materialize_product_frontdoor_assets.py
          git diff --check

      - name: Commit materialized assets and remove this controller
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-product-frontdoor-assets.yml
          git config user.name "SZL Product Origin Controller"
          git config user.email "stephenlutar2@gmail.com"
          git add index.html assets scripts tests .github/workflows/product-frontdoor-assets-contract.yml .github/workflows/materialize-product-frontdoor-assets.yml
          git commit -s -m "fix(frontend): materialize exact A11oy assets at the product origin"
          git push origin HEAD:fix/product-frontdoor-spectral-assets-v2

      - name: Resolve the exact open pull request
        id: pr
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head fix/product-frontdoor-spectral-assets-v2 --json number --jq '.[0].number // empty')"
          test -n "$number"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Wait for all replacement-head checks
        working-directory: target
        run: gh pr checks "${{ steps.pr.outputs.number }}" --repo "$GITHUB_REPOSITORY" --watch --fail-fast --interval 10

      - name: Merge through ordinary protection
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --subject "fix(frontend): publish exact-source Spectral and Flow assets at the product origin"
